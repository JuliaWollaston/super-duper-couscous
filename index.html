<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄工作法计时器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="timer-wrapper">
            <h1>番茄工作法</h1>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="timer">计时器</button>
                <button class="tab-btn" data-tab="tasks">任务管理</button>
                <button class="tab-btn" data-tab="stats">统计数据</button>
            </div>

            <div class="tab-content" id="timer-tab">
                <div class="timer-display">
                    <div class="timer-circle">
                        <div class="timer-time">
                            <span id="minutes">25</span>
                            <span class="separator">:</span>
                            <span id="seconds">00</span>
                        </div>
                        <div class="timer-label" id="timer-label">专注时间</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="start-btn" class="btn btn-primary">开始</button>
                    <button id="pause-btn" class="btn btn-secondary">暂停</button>
                    <button id="reset-btn" class="btn btn-danger">重置</button>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="pomodoro-count">0</span>
                        <span class="stat-label">已完成番茄</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="current-session">工作</span>
                        <span class="stat-label">当前状态</span>
                    </div>
                </div>
                
                <div class="session-controls">
                    <div class="session-setting">
                        <label>工作时长（分钟）:</label>
                        <input type="number" id="work-duration" value="25" min="1" max="60">
                    </div>
                    <div class="session-setting">
                        <label>休息时长（分钟）:</label>
                        <input type="number" id="break-duration" value="5" min="1" max="30">
                    </div>
                    <div class="session-setting">
                        <label>长休息时长（分钟）:</label>
                        <input type="number" id="long-break-duration" value="15" min="1" max="60">
                    </div>
                    <div class="session-setting">
                        <label>番茄数（长休息前）:</label>
                        <input type="number" id="pomodoros-before-long-break" value="4" min="1" max="10">
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tasks-tab" style="display: none;">
                <div class="tasks-header">
                    <h2>任务列表</h2>
                    <button id="add-task-btn" class="btn btn-primary">添加任务</button>
                </div>
                
                <div id="task-list" class="task-list">
                    <div class="empty-state">暂无任务</div>
                </div>
                
                <div id="task-modal" class="modal">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <h3 id="modal-title">添加任务</h3>
                        <form id="task-form">
                            <input type="hidden" id="task-id">
                            <div class="form-group">
                                <label>任务名称:</label>
                                <input type="text" id="task-title" required>
                            </div>
                            <div class="form-group">
                                <label>任务描述:</label>
                                <textarea id="task-description"></textarea>
                            </div>
                            <div class="form-group">
                                <label>目标番茄数:</label>
                                <input type="number" id="task-target-pomodoros" value="1" min="1" max="20">
                            </div>
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" id="cancel-btn" class="btn btn-secondary">取消</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="stats-tab" style="display: none;">
                <div class="stats-header">
                    <h2>统计数据</h2>
                    <div class="period-selector">
                        <button class="period-btn active" data-period="today">今日</button>
                        <button class="period-btn" data-period="week">本周</button>
                        <button class="period-btn" data-period="month">本月</button>
                    </div>
                </div>
                
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon">🍅</div>
                        <div class="stat-info">
                            <span class="stat-value-large" id="total-pomodoros">0</span>
                            <span class="stat-label">完成番茄</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏰</div>
                        <div class="stat-info">
                            <span class="stat-value-large" id="work-minutes">0</span>
                            <span class="stat-label">工作时长(分钟)</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">😴</div>
                        <div class="stat-info">
                            <span class="stat-value-large" id="break-minutes">0</span>
                            <span class="stat-label">休息时长(分钟)</span>
                        </div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <canvas id="pomodoro-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
